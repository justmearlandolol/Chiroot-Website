    this.topic = 'realtime:' + channel;

    this.joined = false;
    this.closed = false;

    var m = { topic: topic, event: event, payload: payload, ref: String(this.ref) };

    return String(this.ref);
  };
  Rt.prototype.connect = function () {

    ws.onopen = function () {

    };

      self.joined = false;
      clearInterval(self.hb);
      if (self.closed) return;
      self.retry = Math.min(self.retry + 1, 6);

    };
  };
  Rt.prototype.send = function (event, payload) {
    if (!this.joined) return false;
    return !!this.push(this.topic, 'broadcast', { type: 'broadcast', event: event, payload: payload });
  };
  Rt.prototype.close = function () {
    this.closed = true;
    clearInterval(this.hb);
    if (this.ws) { try { this.push(this.topic, 'phx_leave', {}); this.ws.close(); } catch (e) {} }

  var rt = null;
  var uid = null;
  var lastSig = '';
  var lastSent = 0;

  function sess() { try { return (typeof ChirootAuth !== 'undefined' && ChirootAuth.session) ? ChirootAuth.session : null; } catch (e) { return null; } }
  function sbUrl() { try { return String(SUPABASE_URL).trim().replace(/\/+$/, ''); } catch (e) { return ''; } }

  function trackInfo(t) {

      title: info.title || '',
      artist: info.artist || '',

      labelColor: info.labelColor,

      queue: queue,
      ts: Date.now()

  }

  function pushState(force) {
    if (!rt || !rt.joined) return;
    var s = buildState();
    var sig = JSON.stringify([s.trackId, s.title, s.cover, s.isPlaying, s.armOn, s.isLoop, s.isShuffle, s.reverb, Math.round(s.duration), s.queue.map(function (x) { return x.id; }).join(',')]);

    lastSig = sig;
    lastSent = Date.now();
    rt.send('state', s);
  }

  function later(f) { setTimeout(function () { f(); pushState(true); }, 0); setTimeout(function () { pushState(true); }, 600); }

  function handleCmd(c) {
    if (!c || !c.action) return;
    var au = el('audio');
    var list = (typeof tracks !== 'undefined' && Array.isArray(tracks)) ? tracks : [];
    switch (c.action) {
      case 'toggle': later(function () { var b = el('btn-play'); if (b) b.click(); }); break;
      case 'play': later(function () { if (au && au.paused) el('btn-play').click(); }); break;
      case 'pause': later(function () { if (au && !au.paused) el('btn-play').click(); }); break;
      case 'stop': later(function () { if (typeof stop === 'function') stop(); else el('btn-stop').click(); }); break;
      case 'next': later(function () { if (typeof nextTrack === 'function') nextTrack(); else el('btn-next').click(); }); break;
      case 'prev': later(function () { if (typeof prevTrack === 'function') prevTrack(); else el('btn-prev').click(); }); break;
      case 'loop': later(function () { var b = el('btn-loop'); if (b) b.click(); }); break;
      case 'reverb': later(function () { var b = el('btn-reverb'); if (b) b.click(); }); break;
      case 'shuffle': later(function () { var b = el('btn-shuffle'); if (b) b.click(); }); break;

        later(function () { if (au && c.arg && isFinite(c.arg.time)) au.currentTime = Math.max(0, Math.min(c.arg.time, au.duration || c.arg.time)); });

        later(function () {
          if (typeof playQueue === 'undefined' || !c.arg) return;
          var qi = c.arg.index;

          var idx = list.findIndex(function (t) { return String(t.id) === String(playQueue[qi]); });
          removeFromQueue(qi, true);
          if (idx >= 0) loadTrack(idx, true, true);
        });
        break;
      case 'queue-remove':
        later(function () {
          if (typeof playQueue === 'undefined' || !c.arg) return;
          var qi = c.arg.index;
          if (!(qi >= 0 && qi < playQueue.length) || String(playQueue[qi]) !== String(c.arg.id)) qi = playQueue.findIndex(function (x) { return String(x) === String(c.arg.id); });
          if (qi >= 0) removeFromQueue(qi, false);
        });
        break;
      case 'queue-clear': later(function () { if (typeof clearQueue === 'function') clearQueue(true); }); break;
    }
  }

  function start(s) {

    uid = s.user.id;
    rt = new Rt(sbUrl(), sbKey(), 'chiroot-player-' + uid, function () { var x = sess(); return x ? x.access_token : null; });

    var au = el('audio');

    au.__cwBound = true;
    ['play', 'pause', 'ended', 'loadedmetadata', 'seeked', 'emptied'].forEach(function (ev) {
