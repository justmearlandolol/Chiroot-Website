<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Chiroot for Windows</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3e9;color:#1a1a1a;font-family:'Patrick Hand',system-ui,sans-serif;padding:20px}
.card{width:100%;max-width:540px;background:linear-gradient(180deg,#f4faff,#e6f0fb);border:2.5px solid #1a1a1a;border-radius:24px 18px 22px 20px/20px 22px 18px 24px;padding:32px 26px;text-align:center;box-shadow:6px 8px 0 #7ab6e0,0 16px 40px rgba(20,90,150,.15);transform:rotate(-.5deg)}
.badge{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0b4d80;border:1.8px dashed #7ab6e0;padding:4px 12px;border-radius:50px;margin-bottom:14px}
h1{font-family:'Caveat',cursive;font-size:36px;line-height:1.05;margin:0 0 8px;color:#0b4d80}
h1 span{color:#00ADEF}
p{margin:0 auto 14px;max-width:42ch;line-height:1.5;color:#3a6890;font-size:16px}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.pill{background:#f0f7fd;border:2px solid #1a1a1a;border-radius:999px;padding:5px 12px;font-size:13px;color:#0b4d80}
.pill b{color:#0078c8}
.progress-wrap{margin:20px 0 10px;display:none;transition:opacity .4s,transform .4s}
.progress{height:10px;background:#d8ebfa;border:2px solid #1a1a1a;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#00ADEF,#0078c8);transition:width .15s ease}
.status{font-size:13px;color:#5a84a8;margin-top:8px}
.done-wrap{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:22px 0 6px;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.check-circle{width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,#d6f0d9,#b6e3bb);border:2.5px solid #1a1a1a;display:grid;place-items:center;box-shadow:0 4px 0 #5ebf7a}
.check-circle svg{width:46px;height:46px}
.check-circle .circle{stroke:#1a6a2a;stroke-width:2.6;stroke-dasharray:166;stroke-dashoffset:166;animation:drawCircle .6s ease forwards}
.check-circle .check{stroke:#104a1c;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:drawCheck .4s .6s ease forwards}
@keyframes drawCircle{to{stroke-dashoffset:0}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.done-title{font-family:'Caveat',cursive;font-size:30px;color:#104a1c;margin:0}
.done-sub{font-size:15px;color:#3a6a4a;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#eaf5ff,#cfe6f9);border:2.5px solid #1a1a1a;color:#0b4d80;border-radius:16px 14px 18px 15px/14px 18px 14px 16px;padding:13px 24px;font-weight:700;font-size:17px;text-decoration:none;box-shadow:0 4px 0 #7ab6e0;transition:transform .12s;width:100%;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7ab6e0}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(180deg,#d6f0d9,#b6e3bb);border-color:#1a6a2a;color:#104a1c;box-shadow:0 4px 0 #5ebf7a}
.small{margin-top:14px;font-size:13px;color:#6b8aaa;display:block;line-height:1.4}
.small a{color:#0b4d80;text-decoration:underline}
.small code{background:#e4effb;border:1.5px solid #7ab6e0;padding:1px 6px;border-radius:6px;font-family:monospace}
</style>
</head>
<body>
<div class="card">

<h1 id="mainTitle">Download <span>Chiroot</span></h1>
<p id="mainDesc">File .exe dari GitHub Release. Klik tombol di bawah untuk mulai download.</p>

<div class="progress-wrap" id="progressWrap">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="status" id="status">0%</div>
</div>

<div class="done-wrap" id="doneWrap">
<div class="check-circle">
<svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle class="circle" cx="26" cy="26" r="20" fill="none"/>
<path class="check" d="M14 26 L22 34 L38 18" fill="none"/>
</svg>
</div>
<h2 class="done-title">Download selesai ✓</h2>
<p class="done-sub">Cek folder Downloads kamu. File siap di-install.</p>
</div>

<button id="downloadBtn" class="btn btn-primary" type="button">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
Download Chiroot.exe
</button>

<a href="https://github.com/justmearlandolol/Chiroot-Website/releases/tag/v1_2_2Windows" target="_blank" rel="noopener" class="btn" style="margin-top:10px;background:#fbf6e8">
Lihat di GitHub Releases Terbaru
</a>

<span class="small">Source: <a href="https://github.com/justmearlandolol/Chiroot-Website" target="_blank" rel="noopener">justmearlandolol/Chiroot-Website</a></span>

</div>

<script>
const EXE_URL = "https://github.com/justmearlandolol/Chiroot-Website/releases/download/v1_2_2Windows/Chiroot.exe";
const EXE_NAME = "Chiroot.exe";
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const progressWrap = document.getElementById('progressWrap');
const doneWrap = document.getElementById('doneWrap');
let busy = false;
function showDone() {
  bar.style.width = '100%';
  statusEl.textContent = '100%';
  progressWrap.style.opacity = '0';
  progressWrap.style.transform = 'translateY(-8px)';
  setTimeout(() => {
    progressWrap.style.display = 'none';
    doneWrap.style.display = 'flex';
  }, 400);
}
function startDownload() {
  if (busy) return;
  busy = true;
  downloadBtn.disabled = true;
  progressWrap.style.display = 'block';
  progressWrap.style.opacity = '1';
  progressWrap.style.transform = 'translateY(0)';
  const a = document.createElement('a');
  a.href = EXE_URL;
  a.download = EXE_NAME;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  const t0 = performance.now();
  const dur = 1800;
  function tick(t) {
    const k = Math.min((t - t0) / dur, 1);
    const pct = Math.round((1 - Math.pow(1 - k, 3)) * 100);
    bar.style.width = pct + '%';
    statusEl.textContent = pct + '%';
    if (k < 1) requestAnimationFrame(tick);
    else showDone();
  }
  requestAnimationFrame(tick);
}
downloadBtn.addEventListener('click', startDownload);
</script>
</body>
</html>
