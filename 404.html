<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiroot</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fcf9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px 16px 28px;
    }

    .error-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    .protected-image {
      display: block;
      max-width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .home-button {
      position: absolute;
      top: 89.8%;
      left: 50.43%;
      transform: translateX(-50%);
      min-width: 21%;
      min-height: 11.3%;
      padding: clamp(6px, 1vw, 10px) clamp(14px, 2.3vw, 24px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #242423;
      color: #ffffff;
      border: 2px solid #f3c525;
      border-radius: 999px;
      font-family: inherit;
      font-size: clamp(11.5px, 1.5vw, 14.5px);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(36, 36, 35, 0.22);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .arrow-icon {
      width: clamp(14px, 1.6vw, 17px);
      height: clamp(14px, 1.6vw, 17px);
      color: #fed503;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background-color: #fed503;
      color: #1f1f1e;
      border-color: #242423;
      transform: translateX(-50%) scale(1.04);
      box-shadow: 0 6px 18px rgba(243, 197, 37, 0.42);
      outline: none;
    }

    .home-button:hover .arrow-icon,
    .home-button:focus-visible .arrow-icon {
      color: #1f1f1e;
      transform: translateX(-3px);
    }

    .home-button:active,
    .home-button.is-pressed {
      transform: translateX(-50%) scale(0.99);
      box-shadow: 0 2px 8px rgba(36, 36, 35, 0.25);
    }
  </style>
</head>
<body>
  <div class="center-container">
    <div class="error-wrapper">
      <img id="errorImage" class="protected-image" src="error.png" alt="404 Page Not Found" draggable="false">
      <a href="Main.html" id="homeButton" class="home-button">
        <svg class="arrow-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M15.833 10H4.167M4.167 10L9.167 5M4.167 10L9.167 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Go Back Home</span>
      </a>
    </div>
  </div>

  <script>
    (function () {
      const homeButton = document.getElementById("homeButton");
      const errorImage = document.getElementById("errorImage");
      const targetPage = "Main.html";

      if (errorImage) {
        errorImage.addEventListener("contextmenu", function (event) {
          event.preventDefault();
        });
        errorImage.addEventListener("dragstart", function (event) {
          event.preventDefault();
        });
      }

      if (homeButton) {
        homeButton.addEventListener("click", function (event) {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) {
            return;
          }
          event.preventDefault();
          homeButton.classList.add("is-pressed");
          window.location.href = targetPage;
        });
      }
    })();
  </script>
</body>
</html>
